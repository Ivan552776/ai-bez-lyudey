<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#1c1c1c;font-family:"Golos Text"}
.p{padding:16px 18px 110px}.hd{display:flex;justify-content:space-between;align-items:center}.hd b{font-size:20px;font-weight:800;letter-spacing:-.02em}.hd span{font-size:12px;color:#777}
.map{position:relative;height:250px;margin:14px 0 6px;background:#fafafa;border-radius:18px;overflow:hidden}
svg{position:absolute;inset:0}
.here{position:absolute;left:180px;top:104px;background:#1c1c1c;color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px}
.lines{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.lines span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:999px;background:#f3f3f3}.lines i{width:10px;height:10px;border-radius:50%}
h2{font-size:13px;letter-spacing:.1em;color:#777;margin:0 0 8px}
.st{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #eee;align-items:start}
.st .dot{width:22px;height:22px;border-radius:50%;border:5px solid;background:#fff;margin-top:2px}
.st b{display:block;font-size:16px;line-height:1.3}.st small{display:block;color:#777;font-size:13px;margin-top:2px}
.go{display:flex;justify-content:center;background:#1c1c1c;color:#fff;border-radius:14px;padding:14px;font-weight:700;margin-top:14px}
.dock{position:fixed;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-around;background:#fff;border:2px solid #1c1c1c;border-radius:16px;padding:8px}.dock span{font-size:13px;font-weight:700;color:#999}.dock span.on{color:#1c1c1c}
</style></head><body><div class="p">
<div class="hd"><b>ИИ без людей</b><span>схема обучения</span></div>
<div class="map"><svg viewBox="0 0 354 250"><g fill="none" stroke-width="9" stroke-linecap="round">
<path d="M20 60 H150 L200 110 H334" stroke="#1FA65A"/><path d="M40 210 L120 130 H200 L260 70 H330" stroke="#8B5CF6"/><path d="M180 20 V230" stroke="#0EA5E9"/><path d="M20 160 H330" stroke="#F59E0B"/></g>
<g fill="#fff" stroke="#1c1c1c" stroke-width="3"><circle cx="70" cy="60" r="7"/><circle cx="150" cy="60" r="7"/><circle cx="200" cy="110" r="10"/><circle cx="280" cy="110" r="7"/><circle cx="120" cy="130" r="7"/><circle cx="260" cy="70" r="7"/><circle cx="180" cy="160" r="10"/><circle cx="90" cy="160" r="7"/><circle cx="290" cy="160" r="7"/><circle cx="180" cy="40" r="7"/></g></svg><span class="here">Вы здесь</span></div>
<div class="lines"><span><i style="background:#1FA65A"></i>ChatGPT</span><span><i style="background:#8B5CF6"></i>Claude</span><span><i style="background:#0EA5E9"></i>DeepSeek</span><span><i style="background:#F59E0B"></i>Промпты</span></div>
<h2>СЛЕДУЮЩИЕ СТАНЦИИ</h2>
<div class="st"><span class="dot" style="border-color:#F59E0B"></span><span><b>Ответ клиенту при задержке заказа</b><small>Промпты · пересадка на ChatGPT · 7 мин</small></span></div>
<div class="st"><span class="dot" style="border-color:#0EA5E9"></span><span><b>DeepSeek показывает ход мысли</b><small>Нейросеть · работает из России</small></span></div>
<div class="go">Поехали: следующая станция</div>
</div><div class="dock"><span class="on">Схема</span><span>Станции</span><span>Курсы</span><span>Я</span></div></body></html>
