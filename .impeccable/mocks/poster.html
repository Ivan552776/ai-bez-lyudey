<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#F1E7D2;color:#20312B;font-family:"Golos Text"}
.p{padding:16px 16px 110px}.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.hd b{font-family:"Russo One";font-size:21px}.hd span{font-size:12px;color:#6f6a5a}
.poster{border-radius:6px;overflow:hidden;box-shadow:0 18px 30px -20px #3a2a0a88}
.scene{height:250px;position:relative;background:#2E8A87}
.scene i{position:absolute;display:block}
.cap{background:#20312B;color:#F1E7D2;padding:16px 16px 18px}
.cap h1{font-family:"Russo One";font-size:30px;line-height:1.02;margin:0 0 8px;letter-spacing:.01em;text-transform:uppercase}
.cap p{margin:0 0 12px;font-size:14.5px;color:#d6ceb9}
.cap .go{display:inline-flex;background:#E0913A;color:#20312B;font-weight:700;padding:11px 16px;border-radius:4px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.m{border-radius:6px;overflow:hidden}.m .s{height:90px;position:relative}.m .c{background:#20312B;color:#F1E7D2;padding:10px}
.m .c b{font-family:"Russo One";font-size:14px;text-transform:uppercase;display:block;line-height:1.1}.m .c small{font-size:11.5px;color:#cfc6af}
.dock{position:fixed;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-around;background:#20312B;border-radius:6px;padding:8px}.dock span{font-size:13px;font-weight:700;color:#a8a08a}.dock span.on{color:#E0913A}
</style></head><body><div class="p">
<div class="hd"><b>ИИ БЕЗ ЛЮДЕЙ</b><span>маршруты по нейросетям</span></div>
<div class="poster"><div class="scene">
<i style="left:0;right:0;top:0;height:120px;background:#2E8A87"></i>
<i style="left:250px;top:30px;width:70px;height:70px;border-radius:50%;background:#F2C14E"></i>
<i style="left:-40px;right:120px;bottom:60px;height:130px;background:#C9743C;clip-path:polygon(0 100%,35% 10%,60% 55%,100% 100%)"></i>
<i style="left:120px;right:-40px;bottom:40px;height:150px;background:#8E4A2B;clip-path:polygon(0 100%,45% 0,100% 100%)"></i>
<i style="left:0;right:0;bottom:0;height:70px;background:#3F6B4A"></i></div>
<div class="cap"><h1>Ответь клиенту спокойно</h1><p>Промпт дня: признай задержку и не обещай лишнего. 7 минут.</p><span class="go">Взять промпт</span></div></div>
<div class="mini"><div class="m"><div class="s" style="background:#E8B94A"><i style="position:absolute;left:0;right:0;bottom:0;height:40px;background:#C9743C;clip-path:polygon(0 100%,50% 0,100% 100%)"></i></div><div class="c"><b>Разбери документ</b><small>гайд · 2 мин</small></div></div>
<div class="m"><div class="s" style="background:#6C8FB5"><i style="position:absolute;left:20px;top:20px;width:40px;height:40px;border-radius:50%;background:#F1E7D2"></i></div><div class="c"><b>DeepSeek</b><small>работает из России</small></div></div></div>
</div><div class="dock"><span class="on">Маршруты</span><span>Курсы</span><span>Я</span></div></body></html>
